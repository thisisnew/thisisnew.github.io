name: Verify and deploy thisisnew blog
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify all static pages and local links
        run: |
          python tools/verify_site.py
          python scripts/check-aws.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: examples/kafka-lab/pom.xml
      - name: Verify JVM series links, content, and Java 21 examples
        run: |
          python scripts/check-jvm.py
          python scripts/check-jvm-java.py
          python scripts/check-jvm-diagnostics.py
      - name: Compile Java and Spring examples and test topology and offset boundaries
        run: mvn -B -f examples/kafka-lab/pom.xml test
      - name: Start Kafka 4.3.1 single-broker lab
        run: docker run -d --name kafka-study -p 9092:9092 apache/kafka:4.3.1
      - name: Wait for broker readiness
        run: |
          for attempt in $(seq 1 60); do
            if docker exec kafka-study /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list; then
              exit 0
            fi
            sleep 2
          done
          docker logs kafka-study
          exit 1
      - name: Produce consume commit and clean up real lab data
        run: mvn -B -f examples/kafka-lab/pom.xml exec:java -Dexec.mainClass=study.Lab
      - name: Verify Spring publisher listener and manual acknowledgment against Kafka
        run: mvn -B -f examples/kafka-lab/pom.xml test -Dkafka.it=true
      - name: Broker logs on failure
        if: failure()
        run: docker logs kafka-study || true
  verify-mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install MySQL test client
        run: pip install 'PyMySQL[rsa]==1.1.1'
      - name: Start isolated MySQL 8.0.36 lab
        run: docker run -d --name mysql-school -e MYSQL_ROOT_PASSWORD=LocalStudyOnly_83 -e MYSQL_ROOT_HOST=% -p 127.0.0.1:3307:3306 mysql:8.0.36
      - name: Wait for MySQL
        run: |
          for attempt in $(seq 1 60); do
            if docker exec -e MYSQL_PWD=LocalStudyOnly_83 mysql-school mysql -uroot -e 'SELECT 1'; then
              exit 0
            fi
            sleep 2
          done
          docker logs mysql-school
          exit 1
      - name: Verify published SQL, concurrency, restart, and restore
        run: python tools/verify_mysql.py --database
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runner
        run: |
          npm install --no-save playwright@1.51.1
          npx playwright install --with-deps chromium
      - name: Verify desktop mobile search and expandable answers
        run: |
          node tools/check_mysql_browser.cjs
          node tools/check_categories.cjs
          node scripts/check-aws-browser.cjs
      - name: Upload MySQL verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mysql-verification
          path: |
            learning/mysql-*-checks.json
            learning/aws/*checks.json
            mysql-screenshots/
      - name: MySQL logs on failure
        if: failure()
        run: docker logs mysql-school || true
  deploy:
    if: github.event_name != 'pull_request'
    needs: [verify, verify-mysql]
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare static files only
        run: |
          mkdir _site
          cp index.html _site/
          cp -r assets posts learning _site/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
